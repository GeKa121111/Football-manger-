name: Deploy Touchline Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check advanced-data.js
          node --check advanced-engine.js
          node --check spatial-match-engine.js
          node --check advanced-ui.js
          node --check simulation-worker.js
          node --check career-storage.js
          node tests/smoke.test.cjs
          node tests/advanced.test.cjs
          node tests/spatial-match.test.cjs
          node tests/tactical-phases.test.cjs
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html app.js styles.css advanced.css advanced-data.js advanced-player-data.js spatial-match-engine.js advanced-engine.js career-storage.js advanced-ui.js simulation-worker.js manifest.webmanifest icon.svg service-worker.js dist/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
