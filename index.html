<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b19">
  <meta name="description" content="Touchline Manager — محاكي إدارة نادي كرة قدم">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Touchline Manager</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="advanced.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="التنقل الرئيسي">
      <a class="brand" href="#" aria-label="Touchline Manager">
        <span class="brand-mark">TM</span>
        <span class="brand-copy"><strong>TOUCHLINE</strong><small>MANAGER</small></span>
      </a>
      <div class="club-mini">
        <div class="club-crest" id="sidebar-crest">CU</div>
        <div class="club-mini-copy"><strong id="sidebar-club">القاهرة يونايتد</strong><small id="sidebar-season">الموسم 2026/27</small></div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="overview"><span class="nav-symbol">◫</span><span>مركز الإدارة</span></button>
        <button class="nav-item" data-view="squad"><span class="nav-symbol">♙</span><span>الفريق</span><span class="nav-count" id="squad-count">20</span></button>
        <button class="nav-item" data-view="tactics"><span class="nav-symbol">⌗</span><span>التكتيك</span></button>
        <button class="nav-item" data-view="fixtures"><span class="nav-symbol">▦</span><span>المباريات والدوري</span></button>
        <button class="nav-item" data-view="transfers"><span class="nav-symbol">⇄</span><span>الانتقالات</span></button>
        <button class="nav-item" data-view="training"><span class="nav-symbol">↗</span><span>التدريب</span></button>
        <button class="nav-item" data-view="finances"><span class="nav-symbol">◇</span><span>المالية</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="save-state"><span class="status-dot"></span><span id="save-label">الحفظ التلقائي مفعّل</span></div>
        <button class="subtle-button full-width" id="reset-game">بدء مسيرة جديدة</button>
        <div class="version-label">BUILD 0.1.0 · LOCAL SAVE</div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark small">TM</span><strong>TOUCHLINE</strong></div>
        <div class="breadcrumb"><span>إدارة النادي</span><span class="crumb-sep">/</span><strong id="page-title">مركز الإدارة</strong></div>
        <div class="topbar-right">
          <div class="date-pill"><span class="date-dot"></span><span id="current-date">الأربعاء، 1 يوليو 2026</span></div>
          <button class="icon-button" id="save-now" aria-label="حفظ الآن" title="حفظ الآن">▣</button>
          <div class="manager-avatar">م</div>
        </div>
      </header>
      <section class="page-content" id="view-root" tabindex="-1">
        <div class="loading-state">جاري تجهيز النادي...</div>
      </section>
      <footer class="mobile-footer"><span>TOUCHLINE MANAGER</span><span id="mobile-footer-date">2026/27</span></footer>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <script src="app.js" defer></script>
  <script src="advanced-data.js" defer></script>
  <script src="advanced-player-data.js" defer></script>
  <script src="advanced-engine.js" defer></script>
  <script src="advanced-ui.js" defer></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function (error) {
          console.warn("Offline support could not be enabled.", error);
        });
      });
    }
  </script>
</body>
</html>
